name: Desktop build candidates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-arm64:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install native Qt 5 and package tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake dpkg-dev qtbase5-dev libqt5svg5-dev
      - name: Build, test and package for Ubuntu ARM64
        run: bash packaging/linux-arm64.sh "1.0~ci.${GITHUB_RUN_NUMBER}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zhili-ubuntu22-arm64-candidate
          path: build-linux-arm64/dist/*
          if-no-files-found: error
          retention-days: 7

  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fetch Qt 5.15.2 Windows SDK
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -O build-qt
      - name: Build, test and package for Windows x64
        shell: pwsh
        run: ./packaging/windows-x64.ps1 -QtPrefix build-qt/5.15.2/msvc2019_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zhili-windows-x64-candidate
          path: build-windows-x64/dist/*
          if-no-files-found: error
          retention-days: 7
