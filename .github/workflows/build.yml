name: Portable desktop builds

on:
  push:
    tags: ['v*-test.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-arm64:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build against Qt 5.12 and glibc 2.31
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD:/src" -w /src ubuntu:20.04 bash -ec '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends               build-essential cmake file qtbase5-dev libqt5svg5-dev
            bash packaging/linux-arm64-portable.sh
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zhili-linux-arm64
          path: build-linux-arm64-portable/dist/*
          if-no-files-found: error

  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fetch Qt 5.15.2 Windows SDK and matching sources
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -O build-qt --archives qtbase qtsvg qttools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $build = 'build-windows-x64'
          New-Item -ItemType Directory -Force "$build/dist","$build/qt-license-notices" | Out-Null
          foreach ($module in @('qtbase','qtsvg')) {
            $name = "$module-everywhere-src-5.15.2"
            curl.exe -fLsS --retry 3 "https://download.qt.io/archive/qt/5.15/5.15.2/submodules/$name.tar.xz" -o "$build/dist/$name.tar.xz"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($module -eq 'qtbase') {
              tar.exe -xf "$build/dist/$name.tar.xz" -C "$build/qt-license-notices" --strip-components 1 "$name/LICENSE.LGPL3" "$name/LICENSE.GPL3"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Build, test and package Windows x64
        shell: pwsh
        run: ./packaging/windows-x64.ps1 -QtPrefix build-qt/5.15.2/msvc2019_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zhili-windows-x64
          path: build-windows-x64/dist/*
          if-no-files-found: error

  prerelease:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-arm64, windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: zhili-*
          path: dist
          merge-multiple: true
      - name: Publish test tag and both portable packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --prerelease \
            --title "枝理 ZhiLi $TAG" \
            --notes $'解压试用版。Windows x64 解压后运行 simplemap.exe；银河麒麟 ARM64 候选包解压后运行 ZhiLi，需要目标机现有 Qt5 运行库。\n\nWindows 与 Linux ARM64 的 CI 构建和离屏测试通过后才会发布本页。银河麒麟 V10 SP1 / 飞腾 D2000 实机、中文系统输入法和混合 DPI 仍需现场验收。使用步骤见仓库 README。'
